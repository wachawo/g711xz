[package]
name = "g711xz"
version = "0.0.2"
edition = "2021"
description = "Rust implementation of g711xz call recording codec with PyO3 bindings"
license = "MIT"
repository = "https://github.com/wachawo/g711xz"

[lib]
name = "g711xz"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
liblzma = { version = "0.4", default-features = false, features = ["static"] }
thiserror = "1.0"
byteorder = "1.5"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1