name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Style and types, once
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Not `pip install -e .`: with maturin as the backend that compiles the
      # Rust extension, which linting does not need.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5" "mypy>=1.10"

      - name: Check code style
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: |
          mypy g711xz

  # Pure Python and NumPy backends on every platform
  test-python:
    name: Python Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        # ubuntu-latest no longer ships Python 3.9
        exclude:
          - os: ubuntu-latest
            python-version: '3.9'
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # The package is imported from the checkout, so these jobs test the
      # Python and NumPy paths and need no Rust toolchain.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8.0" "pytest-cov>=4.1" "numpy>=1.24"

      - name: Run tests with coverage
        run: |
          python -m pytest test_g711xz.py -v --tb=short --cov=g711xz --cov-report=xml --cov-report=term-missing

      # One matrix job reports the Python and NumPy paths; Codecov merges it
      # with the report of the Rust job.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # Rust extension, built in place with maturin. All three backends run here.
  test-rust:
    name: Rust Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the extension
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.7,<2.0" "pytest>=8.0" "pytest-cov>=4.1" "numpy>=1.24"
          maturin develop --release --locked

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          python -c "import g711xz; assert g711xz.HAS_RUST"
          python -m pytest test_g711xz.py -v --tb=short --cov=g711xz --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # Release wheels, all platforms: run the Publish workflow by hand
  # (workflow_dispatch builds and tests every artifact without publishing).
  build-wheel:
    name: Build Wheel and sdist
    runs-on: ubuntu-latest
    needs: [lint, test-python, test-rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          manylinux: "2014"
          rust-toolchain: stable
          args: --release --locked --sdist --out dist

      - name: Verify wheel contents
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import g711xz; assert g711xz.HAS_RUST; print('Import OK')"
          g711xz --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 30
